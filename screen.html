<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Màn hình chiếu — Chiếm Cứ Điểm</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { padding: 18px; }
    .wrap.wide { display: grid; grid-template-columns: 1.8fr 1fr; gap: 16px; }
    .grid30 .tile { font-size: 14px; }
    .grid30 .tile b { font-size: 18px; }
    #status { font-size: 20px; font-weight: 700; color: var(--accent2); text-align: center; margin-bottom: 10px; }
    #countdown { display: inline-block; margin-top: 8px; color: var(--accent); font-size: 24px; font-weight: 800; text-align: center; width: 100%; }
    @media (max-width: 900px) { .wrap.wide { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap wide">
    <div>
      <div class="card">
        <h1>⚔️ Chiếm Cứ Điểm</h1>
        <div id="status">Đang chờ...</div>
        <div id="countdown">-</div>
        <div id="board"></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>Bảng xếp hạng</h2>
        <div class="teamlist" id="scoreboard"></div>
      </div>
      <div class="card">
        <h2>Diễn biến</h2>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const TEAM_COLORS = {t1:'team-t1',t2:'team-t2',t3:'team-t3',t4:'team-t4',t5:'team-t5',t6:'team-t6'};
    const socket = io();
    let countdownInterval = null;
    
    socket.on('connect', () => socket.emit('join', { role: 'screen' }));
    socket.on('state', s => render(s));

    function startCountdown(endTime) {
      const countdownEl = document.getElementById('countdown');
      if (countdownInterval) clearInterval(countdownInterval);
      
      countdownInterval = setInterval(() => {
        const remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
        countdownEl.textContent = `⏱️ Đấu giá: ${remaining}s`;
        if (remaining <= 0) {
          clearInterval(countdownInterval);
          countdownEl.textContent = '-';
        }
      }, 100);
    }

    function render(s) {
      const statusMap = {
        lobby: 'Chờ ban tổ chức bắt đầu trận đấu',
        bidding: `Vòng ${s.round}: Các đội đang đấu giá bí mật (${Object.values(s.bidSubmitted).filter(Boolean).length}/6)`,
        tile_select: `${s.teams[s.currentWinner].name} thắng đấu giá — đang chọn ô đất...`,
        question: s.currentTileIdx != null ? `${s.teams[s.currentWinner].name} đang trả lời câu hỏi ô ${s.currentTileIdx + 1}` : '',
        special: 'Đang xử lý hiệu ứng đặc biệt...',
        round_end: 'Kết thúc vòng — chờ ban tổ chức tiếp tục',
        game_over: '🏆 Trận đấu đã kết thúc!'
      };
      document.getElementById('status').textContent = statusMap[s.phase] || '';

      if (s.phase === 'bidding' && s.bidEndsAt) {
        startCountdown(s.bidEndsAt);
      } else {
        if (countdownInterval) clearInterval(countdownInterval);
        document.getElementById('countdown').textContent = '-';
      }

      document.getElementById('board').innerHTML = '<div class="grid30">' + s.tiles.map(t => {
        const cls = ['tile'];
        if (t.owner) {
          cls.push('owned');
          cls.push(TEAM_COLORS[t.owner]);
        }
        if (t.bonus) cls.push('bonus');
        if (t.type !== 'hidden' && t.type !== 'normal') cls.push('special');
        if (s.currentTileIdx === t.idx) cls.push('pickable');
        const label = t.owner ? s.teams[t.owner].name : `${t.star}★`;
        return `<div class="${cls.join(' ')}"><b>${t.idx + 1}</b><span>${label}</span></div>`;
      }).join('') + '</div>';

      document.getElementById('scoreboard').innerHTML = s.scoreboard.map((t, i) =>
        `<div class="teamchip ${TEAM_COLORS[t.id]}"><span class="pill info">#${i + 1}</span> <b>${t.name}</b>${t.score}★ · ${t.troops} quân</div>`
      ).join('');

      document.getElementById('log').innerHTML = s.log.slice().reverse().map(l => `<div>• ${l}</div>`).join('');

      if (s.phase === 'question' && s.currentQuestion) {
        document.getElementById('status').innerHTML += `<div class="qtext" style="font-size:16px;margin-top:8px">${s.currentQuestion.question}</div>`;
      }
    }
  </script>
</body>
</html>
